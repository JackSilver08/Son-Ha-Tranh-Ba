name: son-ha-tranh-ba

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sonhatranhba}
      POSTGRES_USER: ${POSTGRES_USER:-sonha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_local_password}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks: [game_net]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__GameDb: Host=db;Port=5432;Database=${POSTGRES_DB:-sonhatranhba};Username=${POSTGRES_USER:-sonha};Password=${POSTGRES_PASSWORD:-change_this_local_password};Pooling=true
    ports:
      - "127.0.0.1:${API_PORT:-5050}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [game_net]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on: [api]
    networks: [game_net]

networks:
  game_net:
    driver: bridge

volumes:
  postgres_data:
